# Loads Gemini/ChatGPT explanation replies into KAIRO with no Claude involvement.
# Upload PDFs or .txt files of copied replies into content/explanations/inbox/ (GitHub website: open the folder →
# Add file → Upload files → Commit). This runs, saves accepted explanations, sends disagreements to the Question
# desk, moves the files to content/explanations/done/, and shows a summary on the run page (Actions tab).
name: Load explanations
on:
  push:
    paths: ['content/explanations/inbox/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: load-explanations, cancel-in-progress: false }
jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anything to load?
        id: inbox
        run: echo "count=$(find content/explanations/inbox -type f ! -name .gitkeep | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Install PDF reader
        if: steps.inbox.outputs.count != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Check and load
        if: steps.inbox.outputs.count != '0'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KAIRO_SUPABASE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -I tools/explanations/ingest.py content/explanations/inbox
      - name: Move loaded files to done/
        if: steps.inbox.outputs.count != '0'
        run: |
          stamp=$(date -u +%Y%m%d-%H%M)
          mkdir -p "content/explanations/done/$stamp"
          find content/explanations/inbox -type f ! -name .gitkeep -exec git mv {} "content/explanations/done/$stamp/" \;
          git config user.name "kairo-bot"; git config user.email "kairo-bot@users.noreply.github.com"
          git commit -m "Explanations loaded ($stamp) [skip ci]" && git push
